AWSTemplateFormatVersion: '2010-09-09'
Description: 'IaCM PoC 3 - CloudFormation Stack to be Migrated to Harness IaCM'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Environment name prefix.
  BucketPrefix:
    Type: String
    Default: iacm-cfn-migrated
    Description: Prefix for the S3 bucket.
  RoleNameParam:
    Type: String
    Default: IaCM-CFN-Migration-Role
    Description: Name of the IAM Role.
  PolicyNameParam:
    Type: String
    Default: IaCM-CFN-Migration-Policy
    Description: Name of the IAM Policy.

Resources:
  # Resource 1: S3 Bucket
  AppS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketPrefix}-${EnvironmentName}-${AWS::Region}-${AWS::AccountId}"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Source
          Value: CloudFormation-POC3

  # Resource 2: IAM Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleNameParam
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # Resource 3: IAM Policy
  S3AccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Ref PolicyNameParam
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${AppS3Bucket.Arn}/*"

Outputs:
  BucketNameOutput:
    Description: "Created S3 Bucket Name"
    Value: !Ref AppS3Bucket
  BucketArnOutput:
    Description: "S3 Bucket ARN"
    Value: !GetAtt AppS3Bucket.Arn
  RoleArnOutput:
    Description: "IAM Role ARN"
    Value: !GetAtt LambdaExecutionRole.Arn
